# Runs in GitHub's cloud every day, so your laptop can stay off. 07:00 UTC = 15:00 Singapore;
# the bot stops by run.stop_by (18:30) so the workbook is ready before 19:00.
# GitHub emails you if a run fails. Run it by hand any time: Actions tab > Daily sourcing > Run workflow.
name: Daily sourcing
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
concurrency: { group: sourcing, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm test
      # DSers renews its login on every use and the old one stops working, so the newest copy is kept in
      # GitHub's private Actions cache between runs (never in git). First run uses the DSERS_TOKEN_BOOTSTRAP secret.
      - name: Restore DSers login
        uses: actions/cache/restore@v4
        with: { path: .dsers-token.json, key: dsers-token-${{ github.run_id }}, restore-keys: dsers-token- }
      - run: node src/run.js
        env:
          DSERS_TOKEN_BOOTSTRAP: ${{ secrets.DSERS_TOKEN_BOOTSTRAP }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Keep DSers login for tomorrow
        if: always() && hashFiles('.dsers-token.json') != ''
        uses: actions/cache/save@v4
        with: { path: .dsers-token.json, key: dsers-token-${{ github.run_id }} }
      - name: Save workbook and state
        if: always()
        run: |
          git config user.name "vourelle-bot"
          git config user.email "vourelle-bot@users.noreply.github.com"
          git add state output
          git commit -q -m "Daily run $(date -u +%F)" || exit 0
          git pull -q --rebase && git push -q
